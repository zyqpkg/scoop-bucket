# 检测 bucket 下带 checkver 的 manifest，从 GitHub 等源获取最新 release 并更新 version/url/hash
name: Checkver (Update Manifests)

on:
  push:
    branches: [ main, master ]
  schedule:
    # 每 30 分钟运行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  checkver:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许 push 更新后的 manifest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

      - name: Run checkver (update manifests with checkver)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -Dir $bucketDir -App '*' -Update

      - name: Regenerate README.md
        shell: pwsh
        run: |
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          $appData = Get-ChildItem "$bucketDir\*.json" | ForEach-Object {
            $app = $_.BaseName
            $manifest = Get-Content $_.FullName -Raw | ConvertFrom-Json
            $version = $manifest.version
            $desc = if ($manifest.description) { $manifest.description -replace '\|', '\|' } else { '' }
            # truncate long descriptions
            if ($desc.Length -gt 60) { $desc = $desc.Substring(0, 57) + '...' }
            $homepage = $manifest.homepage
            $lastUpdated = git log --format="%ad" --date=short -- "bucket/$($_.Name)" | Select-Object -First 1
            if (-not $lastUpdated) { $lastUpdated = '1970-01-01' }
            $homepageLabel = ([uri]$homepage).Host -replace '^www\.', ''
            [PSCustomObject]@{
              App = $app
              Name = $_.Name
              Desc = $desc
              Version = $version
              Homepage = $homepage
              HomepageLabel = $homepageLabel
              LastUpdated = $lastUpdated
            }
          }

          $rows = $appData | Sort-Object { [datetime]$_.LastUpdated } -Descending | ForEach-Object {
            "| [$($_.App)](bucket/$($_.Name)) | $($_.Desc) | $($_.Version) | [$($_.HomepageLabel)]($($_.Homepage)) | $($_.LastUpdated) |"
          }

          $table = $rows -join "`n"

          $readme = @"
          # zyqpkg scoop bucket

          A personal [Scoop](https://scoop.sh/) bucket for Windows apps not available in official buckets.

          ## Add this bucket

          ``````powershell
          scoop bucket add zyqpkg https://github.com/zyqpkg/scoop-bucket
          ``````

          ## Install an app

          ``````powershell
          scoop install zyqpkg/<app-name>
          ``````

          ## Apps

          | App | Description | Version | Homepage | Last Updated |
          |-----|-------------|---------|----------|--------------|
          $table
          "@

          # Remove leading spaces from heredoc indentation
          $readme = $readme -replace '(?m)^          ', ''
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Value $readme -Encoding UTF8

      - name: Commit and push if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ README.md
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(bucket): checkver - update manifests to latest versions"
            git push
          } else {
            Write-Host "No manifest changes, skip commit."
          }
