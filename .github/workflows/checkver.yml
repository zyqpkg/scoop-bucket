# 检测 bucket 下带 checkver 的 manifest，从 GitHub 等源获取最新 release 并更新 version/url/hash
name: Checkver (Update Manifests)

on:
  schedule:
    # 每天 UTC 2:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  checkver:
    runs-on: windows-latest
    permissions:
      contents: write  # 允许 push 更新后的 manifest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

      - name: Run checkver (update manifests with checkver)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -Dir $bucketDir -App '*' -Update

      - name: Commit and push if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(bucket): checkver - update manifests to latest versions"
            git push
          } else {
            Write-Host "No manifest changes, skip commit."
          }
