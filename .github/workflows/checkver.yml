# 检测 bucket 下带 checkver 的 manifest，从 GitHub 等源获取最新 release 并更新 version/url/hash
name: Checkver (Update Manifests)

on:
  push:
    branches: [ main, master ]
    paths: [ bucket/** ]
  schedule:
    # 每小时运行一次
    - cron: '0 * * * *'
  workflow_dispatch:
    # 支持手动触发

concurrency:
  group: checkver
  cancel-in-progress: false

jobs:
  checkver:
    # bot 自提交不需要再次触发检查
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    permissions:
      contents: write  # 允许 push 更新后的 manifest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cache Scoop installation
        uses: actions/cache@v5
        with:
          path: ~/scoop
          key: scoop-${{ runner.os }}-${{ hashFiles('.github/workflows/checkver.yml') }}
          restore-keys: |
            scoop-${{ runner.os }}-

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:USERPROFILE\scoop\apps\scoop\current\bin\scoop.ps1")) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          scoop update

      - name: Run checkver (update manifests with checkver)
        shell: pwsh
        timeout-minutes: 30
        env:
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -Dir $bucketDir -App '*' -Update

      - name: Regenerate README.md
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\update-readme.ps1')

      - name: Commit and push if changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ README.md
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(bucket): checkver - update manifests to latest versions"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          } else {
            Write-Host "No manifest changes, skip commit."
          }