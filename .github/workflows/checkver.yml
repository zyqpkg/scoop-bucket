# 检测 bucket 下带 checkver 的 manifest，从 GitHub 等源获取最新 release 并更新 version/url/hash
name: Checkver (Update Manifests)

on:
  push:
    branches: [ main, master ]
    paths: [ bucket/** ]
  schedule:
    # 每小时运行一次
    - cron: '0 * * * *'
  workflow_dispatch:
    # 支持手动触发

concurrency:
  group: checkver
  cancel-in-progress: false

jobs:
  checkver:
    # bot 自提交不需要再次触发检查
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    permissions:
      contents: write  # 允许 push 更新后的 manifest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute cache key
        id: cache-key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isoWeek = [System.Globalization.ISOWeek]::GetWeekOfYear((Get-Date))
          "week=$isoWeek" >> $env:GITHUB_OUTPUT

      - name: Cache Scoop core
        uses: actions/cache@v5
        with:
          path: |
            ~/scoop/apps/scoop
            ~/scoop/shims
          key: scoop-core-${{ runner.os }}-${{ hashFiles('.github/workflows/checkver.yml') }}-w${{ steps.cache-key.outputs.week }}
          restore-keys: |
            scoop-core-${{ runner.os }}-
            scoop-${{ runner.os }}-

      - name: Install Scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $scoopPs1 = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
          $checkverPs1 = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          if (-not (Test-Path $scoopPs1) -or -not (Test-Path $checkverPs1)) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
            $scoopPs1 = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
            $checkverPs1 = Join-Path $scoopRoot 'apps\scoop\current\bin\checkver.ps1'
          }
          # checkver only needs the Scoop scripts. Do NOT run `scoop update` here:
          # it migrates/updates the official main bucket and fails when the cached
          # core has no ~/scoop/buckets ('main' bucket not found).
          if (-not (Test-Path $checkverPs1)) {
            throw "checkver.ps1 not found at $checkverPs1"
          }
          Write-Host "Using Scoop core at $scoopPs1 (bucket updates skipped)."

      - name: Run checkver (update manifests with checkver)
        shell: pwsh
        timeout-minutes: 30
        env:
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bucketDir = Join-Path $env:GITHUB_WORKSPACE 'bucket'
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -Dir $bucketDir -App '*' -Update

      - name: Regenerate README.md
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\update-readme.ps1')

      - name: Commit and push if changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ README.md
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(bucket): checkver - update manifests to latest versions"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          } else {
            Write-Host "No manifest changes, skip commit."
          }
